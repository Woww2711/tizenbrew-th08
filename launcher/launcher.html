<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Touhou 8 (TH08 Web)</title>
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee; overflow: hidden; font: 28px sans-serif; }
  /* The game draws 640x480: scale it to the largest 4:3 box that fits, centred on black. */
  #canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, 133.334vh); height: min(100vh, 75vw); background: #000; outline: 0; }
  #screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; white-space: pre-wrap; padding: 0 10%; background: #000; font-size: 40px; }
  #banner { position: absolute; left: 0; right: 0; top: 0; padding: 14px 28px; white-space: pre-wrap; z-index: 3; }
  #banner.warn { background: #6a4b00; }
  #banner.error { background: #7a1020; }
  #dialog { position: absolute; left: 15%; right: 15%; top: 35%; padding: 28px; background: #223;
    border: 2px solid #88f; white-space: pre-wrap; text-align: center; z-index: 4; }
  #toast { position: absolute; right: 24px; bottom: 18px; padding: 6px 16px; background: #0008; font-size: 22px; z-index: 2; }
  #fps { position: absolute; left: 16px; bottom: 14px; font-size: 22px; color: #8f8; z-index: 2; }
</style>
</head>
<body>
<canvas id="canvas" width="640" height="480" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="screen">Đang tải…</div>
<div id="banner" hidden></div>
<div id="dialog" hidden></div>
<div id="toast" hidden></div>
<div id="fps" hidden></div>
<script src="saves.js"></script>
<script src="remote-file.js"></script>
<script src="input.js"></script>
<script src="game.js"></script>
<script async src="th08-web.js"></script>
</body>
</html>
