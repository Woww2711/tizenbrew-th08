<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>TH08</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c14; color: #eee; font: 32px sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  #err { color: #f88; max-width: 80%; text-align: center; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="msg">Đang chờ service…</div>
<div id="err"></div>
<script>
  // The service installs the launcher into TizenBrew's data directory; it must run from
  // file:// (only those pages get SharedArrayBuffer on the TV), and this http page cannot
  // navigate there itself, so it asks the service to open it through DevTools.
  var PAGE_VERSION = '0.0.2';
  var SERVICE = 'http://127.0.0.1:8790';
  var asked = 0;        // POST /open attempts
  var waitOk = false;   // came back from the launcher: open it again only on OK
  function show(id, text) { document.getElementById(id).textContent = text; }
  function fail(text) { show('msg', ''); show('err', text); }
  // Request + JSON body within `ms`, so a hung service cannot stop the page.
  function request(url, init, ms) {
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null, timer;
    init = init || {};
    if (ctrl) init.signal = ctrl.signal;
    var work = fetch(url, init).then(function (r) {
      return r.json().then(function (body) { return { status: r.status, body: body }; });
    });
    work.catch(function () {});
    var timeout = new Promise(function (resolve, reject) {
      timer = setTimeout(function () {
        if (ctrl) ctrl.abort();
        reject(new Error('no answer after ' + ms + ' ms'));
      }, ms);
    });
    return Promise.race([work, timeout]).then(function (v) { clearTimeout(timer); return v; },
      function (e) { clearTimeout(timer); throw e; });
  }
  // The last /status answer; every way to open the launcher checks it (a stale service must not open anything).
  var lastStatus = null;
  function canOpen() {
    return !!lastStatus && lastStatus.version === PAGE_VERSION && lastStatus.state === 'ready';
  }
  // An open is wanted but not sent yet (the gate was closed, or a retry was held back by waitOk);
  // poll() sends it once the service is ready again. A POST that is still waiting blocks a second one.
  var pending = false, inFlight = false;
  var openErr = null;   // the error of the last open round, kept on screen while the service polls ready
  function askOpen() {
    if (!canOpen()) { pending = true; return; }
    pending = false;
    inFlight = true;
    asked++;
    openErr = null;   // a new round clears the error of the last one
    show('err', '');
    show('msg', 'Đang mở trang thử…');
    request(SERVICE + '/open', { method: 'POST' }, 5000).then(function (r) {
      inFlight = false;
      if (r.status !== 202) throw new Error('HTTP ' + r.status + ': ' + (r.body && r.body.error));
    }).catch(function (e) {
      inFlight = false;
      if (asked < 3) return setTimeout(retry, 2000);
      openErr = 'Không gửi được yêu cầu mở: ' + e.message + '\nBấm Back rồi mở lại module.';
      fail(openErr);
    });
  }
  // After Back the page never opens on its own: the retry waits for OK (poll() shows the prompt).
  function retry() {
    if (waitOk) pending = true;
    else askOpen();
  }
  // The port is held by another version's service (a module update does not restart it).
  // A newer service that could not take the port says so through that service's /report.
  function stale(s) {
    var note = 'Chưa thấy service ' + PAGE_VERSION + ' báo về.';
    (s.reports || []).forEach(function (r) {
      if (r.source === 'service' && r.version === PAGE_VERSION) note = 'Service ' + PAGE_VERSION + ' báo: ' + r.message;
    });
    fail('Service đang chạy là bản ' + (s.version || '?') + ', trang này là bản ' + PAGE_VERSION + '.\n' + note +
      '\nRút điện TV 1 phút rồi mở lại module.');
  }
  function poll() {
    request(SERVICE + '/status', {}, 5000).then(function (r) {
      var s = r.body;
      lastStatus = s;
      if (s.version !== PAGE_VERSION) { stale(s); return setTimeout(poll, 3000); }
      show('err', openErr || '');   // the last open error stays until a new round starts
      if (s.state === 'error') return fail('Lỗi: ' + s.error);
      if (s.state !== 'ready') {
        show('msg', 'Đang chuẩn bị (chỉ lần đầu): ' + (s.progress || s.state));
        return setTimeout(poll, 500);
      }
      if (waitOk) show('msg', 'Bấm OK để mở lại trang thử, Back để thoát.');
      else if (!inFlight && (pending || !asked)) askOpen();
      else if (s.openError) {
        openErr = 'Không mở được: ' + s.openError + '\nBấm Back rồi mở lại module.';
        return fail(openErr);
      }
      setTimeout(poll, 1000);
    }).catch(function () { lastStatus = null; show('msg', 'Đang chờ service…'); setTimeout(poll, 1000); });
  }
  function cameBack() {
    var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
    return !!nav && nav.type === 'back_forward';
  }
  window.addEventListener('keydown', function (e) {
    if (e.keyCode === 10009) history.back();
    if (e.keyCode === 13 && waitOk && canOpen() && !inFlight) { waitOk = false; askOpen(); }
  });
  // Restored from the back/forward cache: the old poll loop keeps running.
  window.addEventListener('pageshow', function (e) { if (e.persisted) { waitOk = true; asked = 0; pending = false; openErr = null; } });
  waitOk = cameBack();
  poll();
</script>
</body>
</html>
